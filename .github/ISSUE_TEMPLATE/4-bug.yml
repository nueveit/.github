name: Bug
description: Something is broken or behaving unexpectedly
type: Bug
projects: ["nueveit/9"]
body:
  - type: markdown
    attributes:
      value: "Do not paste customer data, account numbers, tokens or passwords. Mask them (e.g. ****1234)."
  - type: markdown
    attributes:
      value: "Set **Product** in the sidebar on the right. The list is managed in org Settings > Issue fields > Product."
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Production
        - UAT / Staging
        - Development
        - Local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (redacted)
