name: Epic
description: A large body of work that is broken down into stories
type: Epic
projects: ["nueveit/9"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this epic deliver and why?
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Set **Product** in the sidebar on the right. The list is managed in org Settings > Issue fields > Product."
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and out of scope?
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How will we know this epic is complete?
  - type: markdown
    attributes:
      value: After creating the epic, add its stories as **sub-issues**.
